# Local development stack: PostgreSQL + API. Not for production.
# Start with: docker compose up --build -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: daymark
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymark -d daymark"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://daymark:${POSTGRES_PASSWORD}@db:5432/daymark?sslmode=disable
      DAYMARK_SETUP_SECRET: ${DAYMARK_SETUP_SECRET:?set DAYMARK_SETUP_SECRET in .env}
      DAYMARK_ENV: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  dbdata:
