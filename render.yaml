
# DayMark Go API on Render with Neon PostgreSQL

services:
  - type: web
    name: daymark-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DAYMARK_SETUP_SECRET
        sync: false
      - key: DAYMARK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
